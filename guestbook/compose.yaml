services:
  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      APP_TITLE: "방명록"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?비밀번호 설정 필요}" #WEV의 enviroment
    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD","python","-c",
        "import urllib.request;
        urllib.request.urlopen(
        'http://localhost:5000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck: #volumes: - redis-data.. 밑에 추가
      test: ["CMD","redis-cli","-a",
        "${REDIS_PASSWORD}","ping"] #수업용
      interval: 5s
      timeout: 3s
      retries: 5

