apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
spec:
  replicas: 4
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
        - name: web
          image: ghcr.io/gpdls2423-sudo/guestbook:3d6de8f
          ports:
            - containerPort: 5000
